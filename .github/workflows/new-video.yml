name: AI_VIDEO_02 request

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Video topic
        required: true
        type: string
      language:
        default: ru
        type: string
      target_minutes:
        default: '1'
        type: string
      style:
        default: serious
        type: string
      source_profile:
        default: owner_supplied
        type: string
      auto_fix_cycles:
        default: '1'
        type: string
      output_profile:
        default: ruslan-local-narration
        type: string

permissions:
  contents: read

concurrency:
  group: ai-video-02-local-production
  cancel-in-progress: false
  queue: max

jobs:
  request:
    # A credentialed self-hosted runner must never execute code selected from a
    # feature branch. Production remains disabled; omitted production_mode uses
    # the Brief contract's safe default: fake.
    if: github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, ai-video-02]
    timeout-minutes: 30
    env:
      VIDEO_REQUEST_JSON: ${{ toJSON(inputs) }}
    steps:
      - name: Verify trusted workflow source
        shell: powershell
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/main') {
            throw 'Self-hosted execution is allowed only from refs/heads/main'
          }
          if ('${{ github.event.repository.private }}' -ne 'true') {
            throw 'Self-hosted execution requires a private repository'
          }

      - name: Checkout exact trusted revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify clean exact checkout
        shell: powershell
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne '${{ github.sha }}') {
            throw "Unexpected checkout SHA: $head"
          }
          $dirty = git status --porcelain --untracked-files=all
          if ($dirty) {
            throw "Runner checkout is not clean:`n$dirty"
          }

      - name: Validate dedicated fake environment
        shell: powershell
        run: |
          if (-not $env:STUDIO_PYTHON) { throw 'STUDIO_PYTHON is required on the runner' }
          if (-not $env:LOCAL_RUN_ROOT) { throw 'LOCAL_RUN_ROOT is required on the runner' }
          if (-not (Test-Path -LiteralPath $env:STUDIO_PYTHON -PathType Leaf)) {
            throw 'STUDIO_PYTHON does not point to an existing executable'
          }
          & $env:STUDIO_PYTHON -X utf8 scripts/healthcheck_multi_ai_v2.py `
            --mode fake `
            --root $env:LOCAL_RUN_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Multi-AI v2 fake healthcheck failed' }

      - name: Submit and advance bounded fake run
        shell: powershell
        run: |
          & $env:STUDIO_PYTHON -X utf8 scripts/dispatch_multi_ai_v2.py
          exit $LASTEXITCODE

      - name: Verify repository stayed clean
        if: ${{ always() }}
        shell: powershell
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dirty = git status --porcelain --untracked-files=all
          if ($dirty) {
            Write-Host $dirty
            throw 'Fake run modified the checked-out repository'
          }

      # No credential files, SQLite databases, media, arbitrary task folders,
      # or raw client logs are uploaded by this workflow.
