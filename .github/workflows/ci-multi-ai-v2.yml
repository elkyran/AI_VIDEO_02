name: Multi-AI V2 CI

on:
  pull_request:
    branches:
      - main
      - feature/multi-ai-coordinator-v2
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/multi_ai_v2_schemas/**'
      - '.github/workflows/**'
      - 'development/multi_ai_v2/**'
      - 'docs/GITHUB_CI_AND_RUNNER.md'
      - 'pyproject.toml'
      - '.env.example'
  push:
    branches:
      - 'feature/multi-ai-coordinator-v2'
      - 'assistant/review-fix-ci-runner-safety'
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/multi_ai_v2_schemas/**'
      - '.github/workflows/**'
      - 'development/multi_ai_v2/**'
      - 'docs/GITHUB_CI_AND_RUNNER.md'
      - 'pyproject.toml'
      - '.env.example'

permissions:
  contents: read

concurrency:
  group: multi-ai-v2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install bounded test dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Compile Python sources
        shell: powershell
        run: python -X utf8 -m compileall -q app scripts tests

      - name: Validate workflow policy and checked-in schemas
        shell: powershell
        run: python -X utf8 scripts/ci_validate_multi_ai_v2.py

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $hadErrors = $false
          foreach ($file in Get-ChildItem -Path scripts -Recurse -Filter *.ps1) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $hadErrors = $true
              Write-Error ("PowerShell parse failure in {0}: {1}" -f $file.FullName, ($parseErrors -join '; '))
            }
          }
          if ($hadErrors) { throw 'PowerShell parser found errors' }

      - name: Run Multi-AI V2 unit tests
        shell: powershell
        run: python -X utf8 -m unittest -v tests.test_multi_ai_v2

      - name: Run existing regression groups
        shell: powershell
        run: |
          $out = Join-Path (Get-Location) '.ci-regression-output'
          if (Test-Path -LiteralPath $out) { throw 'Unexpected pre-existing CI output directory' }
          python -X utf8 scripts/check_multi_ai.py --groups contracts queue adapters mai05 panel legacy --output $out --task-id CI-MULTI-AI-V2
          $code = $LASTEXITCODE
          if ($code -ne 0 -and (Test-Path -LiteralPath $out)) {
            Get-ChildItem -LiteralPath $out -Recurse -Filter *.log | ForEach-Object {
              Write-Host "===== $($_.FullName) ====="
              Get-Content -LiteralPath $_.FullName
            }
          }
          if (Test-Path -LiteralPath $out) { Remove-Item -LiteralPath $out -Recurse -Force }
          if ($code -ne 0) { exit $code }

      - name: Scan Git export for obvious secrets and oversized files
        shell: powershell
        run: |
          python -X utf8 scripts/check_git_export.py
          $code = $LASTEXITCODE
          git restore --worktree --staged -- reports/development/2026-10-20_GITHUB/export_check.json
          if ($code -ne 0) { exit $code }

      - name: Verify clean, whitespace-safe checkout
        shell: powershell
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dirty = git status --porcelain
          if ($dirty) {
            Write-Host $dirty
            throw 'CI checks modified tracked or untracked repository files'
          }
