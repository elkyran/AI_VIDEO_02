name: Multi-AI V2 CI

on:
  pull_request:
    branches:
      - main
      - feature/multi-ai-coordinator-v2
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/multi_ai_v2_schemas/**'
      - '.github/workflows/**'
      - 'development/multi_ai_v2/**'
      - 'docs/GITHUB_CI_AND_RUNNER.md'
      - 'pyproject.toml'
      - '.env.example'
  push:
    branches:
      - 'feature/multi-ai-coordinator-v2'
      - 'assistant/review-fix-ci-runner-safety'
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/multi_ai_v2_schemas/**'
      - '.github/workflows/**'
      - 'development/multi_ai_v2/**'
      - 'docs/GITHUB_CI_AND_RUNNER.md'
      - 'pyproject.toml'
      - '.env.example'

permissions:
  contents: read

concurrency:
  group: multi-ai-v2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI_EVIDENCE_ROOT: ${{ runner.temp }}/multi-ai-v2-evidence
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install bounded test dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check PyYAML==6.0.3 jsonschema==4.26.0

      - name: Validate workflow policy and checked-in schemas
        shell: powershell
        run: python -X utf8 scripts/ci_validate_multi_ai_v2.py

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $hadErrors = $false
          foreach ($file in Get-ChildItem -Path scripts -Recurse -Filter *.ps1) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $hadErrors = $true
              Write-Error ("PowerShell parse failure in {0}: {1}" -f $file.FullName, ($parseErrors -join '; '))
            }
          }
          if ($hadErrors) { throw 'PowerShell parser found errors' }

      - name: Run clean revision-bound core checker
        shell: powershell
        run: |
          if (Test-Path -LiteralPath $env:CI_EVIDENCE_ROOT) {
            throw 'Unexpected pre-existing CI evidence directory'
          }
          python -X utf8 scripts/check_multi_ai_v2.py --output $env:CI_EVIDENCE_ROOT
          $code = $LASTEXITCODE
          if ($code -ne 0 -and (Test-Path -LiteralPath $env:CI_EVIDENCE_ROOT)) {
            Get-ChildItem -LiteralPath $env:CI_EVIDENCE_ROOT -Recurse -Filter *.log | ForEach-Object {
              Write-Host "===== $($_.FullName) ====="
              Get-Content -LiteralPath $_.FullName
            }
          }
          exit $code

      - name: Verify immutable evidence envelope
        if: ${{ always() }}
        shell: powershell
        run: |
          if (-not (Test-Path -LiteralPath $env:CI_EVIDENCE_ROOT)) {
            Write-Warning 'Core checker did not create an evidence directory'
            exit 0
          }
          $manifests = @(Get-ChildItem -LiteralPath $env:CI_EVIDENCE_ROOT -Recurse -Filter manifest.json)
          if ($manifests.Count -ne 1) {
            throw "Expected exactly one manifest.json, found $($manifests.Count)"
          }
          $manifest = $manifests[0]
          $value = Get-Content -LiteralPath $manifest.FullName -Raw | ConvertFrom-Json

          if ($value.dirty -ne $false) { throw 'Published CI evidence must have dirty=false' }
          if ($value.git_commit_sha -ne $env:GITHUB_SHA) {
            throw "Evidence commit $($value.git_commit_sha) does not match GITHUB_SHA $env:GITHUB_SHA"
          }
          $actualTree = (git rev-parse "HEAD^{tree}").Trim()
          if ($value.git_tree_sha -ne $actualTree) {
            throw "Evidence tree $($value.git_tree_sha) does not match checked-out tree $actualTree"
          }
          if ($value.model_requests -ne 0 -or $value.paid_api_requests -ne 0 -or $value.production_started -ne $false) {
            throw 'Offline CI evidence unexpectedly reports a model/API/production operation'
          }

          foreach ($property in $value.files.PSObject.Properties) {
            $relative = $property.Name
            $record = $property.Value
            $file = Join-Path $manifest.DirectoryName $relative
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Evidence file is missing: $relative"
            }
            $item = Get-Item -LiteralPath $file
            if ($item.Length -ne [int64]$record.bytes) {
              throw "Evidence size mismatch: $relative"
            }
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne ([string]$record.sha256).ToLowerInvariant()) {
              throw "Evidence SHA-256 mismatch: $relative"
            }
          }

          $checksFiles = @(Get-ChildItem -LiteralPath $env:CI_EVIDENCE_ROOT -Recurse -Filter checks.json)
          if ($checksFiles.Count -ne 1) {
            throw "Expected exactly one checks.json, found $($checksFiles.Count)"
          }
          $checks = Get-Content -LiteralPath $checksFiles[0].FullName -Raw | ConvertFrom-Json
          if ($checks.source_unchanged_during_checks -ne $true) {
            throw 'Source changed while regression checks were running'
          }
          if ($checks.git_commit_sha -ne $env:GITHUB_SHA -or $checks.git_tree_sha -ne $actualTree) {
            throw 'checks.json is not bound to the checked-out revision'
          }

          $manifestHash = (Get-FileHash -LiteralPath $manifest.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            '## Multi-AI V2 offline CI',
            '',
            "- Checked commit: ``$env:GITHUB_SHA``",
            "- Checked tree: ``$actualTree``",
            "- Evidence status: **$($value.status)**",
            "- Tests recorded: $($checks.test_count)",
            "- Skipped tests: $($checks.skipped_count)",
            "- Model requests: $($value.model_requests)",
            "- Paid API requests: $($value.paid_api_requests)",
            "- Production started: $($value.production_started)",
            "- Manifest SHA-256: ``$manifestHash``"
          ) | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload immutable CI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: multi-ai-v2-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/multi-ai-v2-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Verify clean, whitespace-safe checkout
        if: ${{ always() }}
        shell: powershell
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dirty = git status --porcelain --untracked-files=all
          if ($dirty) {
            Write-Host $dirty
            throw 'CI checks modified tracked or untracked repository files'
          }
